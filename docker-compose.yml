services:
  mariadb:
    image: mariadb:11
    container_name: ku-mech-mariadb
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ku_mech_root_2569}
      MYSQL_DATABASE: ${DB_NAME:-ku_attendance}
      MYSQL_USER: ${DB_USER:-attendance_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ku_mech_pass_2569}
      TZ: Asia/Bangkok
    volumes:
      - ./mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ku-mech-phpmyadmin
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-attendance_user}
      PMA_PASSWORD: ${DB_PASSWORD:-ku_mech_pass_2569}
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"

  attendance-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ku-mech-attendance
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ku_attendance}
      DB_USER: ${DB_USER:-attendance_user}
      DB_PASSWORD: ${DB_PASSWORD:-ku_mech_pass_2569}
      TZ: Asia/Bangkok
    ports:
      - "8080:3000"
