version: '3.8'

services:
  attendance-system:
    # Build จาก Source Code โดยตรงผ่าน Multi-Stage Dockerfile (ไม่จำเป็นต้องมี dist/ บน NAS)
    build:
      context: .
      dockerfile: Dockerfile
    # หรือหากใช้ GitHub Actions สามารถสลับมาใช้ image สำเร็จรูปได้:
    # image: ghcr.io/YOUR_GITHUB_USERNAME/ku-attendance:latest
    container_name: ku-mech-attendance
    restart: unless-stopped
    ports:
      - "8080:80"
