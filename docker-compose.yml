version: '3.8'

services:
  attendance-system:
    # ใช้งาน official image nginx:alpine (ขนาดเล็กเพียง ~10MB รันได้ทันที ไม่ต้อง build)
    image: nginx:alpine
    container_name: ku-mech-attendance
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

